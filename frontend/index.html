<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图书分类 - 上传书籍</title>
  <style>
    :root {
      --wx-green: #07C160;
      --wx-green-hover: #06AD56;
      --bg: #F7F8FA;
      --card-bg: #FFFFFF;
      --text: #191919;
      --text-secondary: #8E8E93;
      --border: #E5E5EA;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial,
        'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei UI', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      color: var(--text);
      line-height: 1.5;
    }
    .container {
      max-width: 780px;
      margin: 0 auto;
      padding: 40px 24px;
    }
    header {
      text-align: center;
      margin-bottom: 48px;
    }
    header h1 {
      font-size: 28px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
    }
    header p {
      font-size: 15px;
      color: var(--text-secondary);
    }
    .upload-zone {
      background: var(--card-bg);
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 48px 32px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 24px;
    }
    .upload-zone:hover, .upload-zone.dragover {
      border-color: var(--wx-green);
      background: rgba(7, 193, 96, 0.04);
    }
    .upload-zone .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      background: linear-gradient(135deg, #E8F8EE 0%, #D4F0E0 100%);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }
    .upload-zone .hint {
      font-size: 16px;
      color: var(--text);
      margin-bottom: 4px;
    }
    .upload-zone .sub {
      font-size: 13px;
      color: var(--text-secondary);
    }
    input[type="file"] { display: none; }
    .file-list {
      background: var(--card-bg);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 24px;
    }
    .file-list .item {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }
    .file-list .item:last-child { border-bottom: none; }
    .file-list .item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; }
    .file-list .item .remove {
      color: var(--text-secondary);
      cursor: pointer;
      padding: 4px;
    }
    .file-list .item .remove:hover { color: #FF3B30; }
    .actions {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }
    .btn {
      flex: 1;
      padding: 14px 24px;
      border: none;
      border-radius: var(--radius);
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    .btn-primary {
      background: var(--wx-green);
      color: white;
    }
    .btn-primary:hover:not(:disabled) {
      background: var(--wx-green-hover);
    }
    .btn-primary:disabled {
      background: #C7C7CC;
      cursor: not-allowed;
    }
    .btn-secondary {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: #F2F2F7; }
    .status-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 24px;
      display: none;
    }
    .status-card.show { display: block; }
    .status-card .status { font-size: 15px; margin-bottom: 8px; }
    .status-card .status.processing { color: #007AFF; }
    .status-card .status.completed { color: var(--wx-green); }
    .status-card .status.failed { color: #FF3B30; }
    .status-card .msg { font-size: 13px; color: var(--text-secondary); }
    .download-btn {
      display: inline-block;
      margin-top: 12px;
      padding: 10px 20px;
      background: var(--wx-green);
      color: white;
      border-radius: 8px;
      text-decoration: none;
      font-size: 14px;
      transition: background 0.2s;
    }
    .download-btn:hover { background: var(--wx-green-hover); }
    .loading-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(0, 0, 0, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(2px);
    }
    .loading-overlay.show { display: flex; }
    .loading-box {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 36px 48px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
      min-width: 260px;
    }
    .loading-spinner {
      width: 44px;
      height: 44px;
      margin: 0 auto 20px;
      border: 3px solid var(--border);
      border-top-color: var(--wx-green);
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-title {
      font-size: 17px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 8px;
    }
    .loading-sub {
      font-size: 14px;
      color: var(--text-secondary);
    }
    .result-panel {
      margin-top: 16px;
    }
    .result-table-wrap {
      width: 100%;
      overflow-x: auto;
      margin-top: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .result-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .result-table thead {
      background: #F7F8FA;
    }
    .result-table th {
      padding: 10px 14px;
      text-align: left;
      font-weight: 500;
      color: var(--text-secondary);
      border-bottom: 1px solid var(--border);
      font-size: 12px;
    }
    .result-table td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      word-break: break-all;
      user-select: text;
    }
    .result-table tr:last-child td {
      border-bottom: none;
    }
    .result-table tr:hover {
      background: rgba(7, 193, 96, 0.03);
    }
    .result-table .err-cell {
      color: #FF3B30;
      font-size: 12px;
    }
    .result-table .cls-cell {
      font-family: 'SF Mono', 'Menlo', monospace;
      color: #007AFF;
      font-weight: 500;
    }
    .result-table .path-cell {
      font-size: 12px;
      color: var(--text-secondary);
      max-width: 280px;
      cursor: help;
    }
    .result-table .path-text {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .path-tooltip-layer {
      display: none;
      position: fixed;
      z-index: 1000;
      min-width: 260px;
      max-width: min(480px, calc(100vw - 32px));
      padding: 12px 14px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      pointer-events: auto;
    }
    .path-tooltip-layer.show {
      display: block;
    }
    .path-tooltip-text {
      font-size: 13px;
      line-height: 1.55;
      color: var(--text);
      word-break: break-word;
      user-select: text;
      -webkit-user-select: text;
      white-space: normal;
      max-height: 240px;
      overflow-y: auto;
    }
    .path-tooltip-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }
    .path-copy-btn {
      padding: 4px 12px;
      font-size: 12px;
      color: #007AFF;
      background: rgba(0, 122, 255, 0.08);
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .path-copy-btn:hover {
      background: rgba(0, 122, 255, 0.14);
    }
    .path-copy-btn.copied {
      color: #07C160;
      background: rgba(7, 193, 96, 0.1);
    }
    .result-summary {
      display: flex;
      gap: 16px;
      margin-bottom: 12px;
      font-size: 13px;
      color: var(--text-secondary);
    }
    .result-summary .stat {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .result-summary .stat .num {
      font-weight: 600;
      color: var(--text);
    }
  </style>
</head>
<body>
  <div class="path-tooltip-layer" id="pathTooltipLayer" role="tooltip" aria-hidden="true">
    <div class="path-tooltip-text" id="pathTooltipText"></div>
    <div class="path-tooltip-actions">
      <button type="button" class="path-copy-btn" id="pathCopyBtn">复制</button>
    </div>
  </div>
  <div class="loading-overlay" id="loadingOverlay" aria-hidden="true">
    <div class="loading-box">
      <div class="loading-spinner"></div>
      <div class="loading-title" id="loadingTitle">正在处理</div>
      <div class="loading-sub" id="loadingSub">请稍候…</div>
    </div>
  </div>
  <div class="container">
    <header>
      <h1>图书分类</h1>
      <p>上传书籍，智能分类，一键下载</p>
    </header>
    <div class="upload-zone" id="uploadZone">
      <div class="icon">📚</div>
      <div class="hint">点击或拖拽书籍到此处</div>
      <div class="sub">支持 .txt、.pdf、.epub、.mobi 格式</div>
      <input type="file" id="fileInput" multiple accept=".txt,.pdf,.epub,.mobi">
    </div>
    <div class="file-list" id="fileList"></div>
    <div class="actions">
      <button class="btn btn-secondary" id="clearBtn">清空</button>
      <button class="btn btn-primary" id="uploadBtn" disabled>开始上传并分类</button>
    </div>
    <div class="status-card" id="statusCard">
      <div class="status" id="statusText">处理中...</div>
      <div class="msg" id="statusMsg"></div>
      <div class="result-panel" id="resultPanel" style="display:none"></div>
      <a class="download-btn" id="downloadBtn" href="#" download="results.zip" style="display:none">下载分类结果</a>
    </div>
  </div>
  <script src="/main.js"></script>
</body>
</html>
